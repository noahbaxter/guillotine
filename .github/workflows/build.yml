name: Build Guillotine

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Verify VST3 bundle
        shell: pwsh
        run: |
          $vst3Path = "build/Guillotine_artefacts/Release/VST3/Guillotine Clip.vst3"
          if (-not (Test-Path $vst3Path)) {
            Write-Error "VST3 bundle not found at $vst3Path"
            Get-ChildItem -Recurse build -Filter "*.vst3" | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "[OK] VST3 bundle exists at $vst3Path"

          $binary = Get-ChildItem -Path $vst3Path -Recurse -Include "*.vst3" -File | Select-Object -First 1
          if ($binary) {
            $sizeMB = [math]::Round($binary.Length / 1MB, 2)
            Write-Host "Binary size: $sizeMB MB"
            if ($binary.Length -lt 1MB) {
              Write-Error "Binary too small - resources likely missing"
              exit 1
            }
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Guillotine-VST3-Windows-x64
          path: build/Guillotine_artefacts/Release/VST3/Guillotine Clip.vst3
          retention-days: 30

  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Use latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Configure CMake
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Verify builds
        run: |
          echo "=== Verifying VST3 bundle ==="
          VST3_PATH="build/Guillotine_artefacts/Release/VST3/Guillotine Clip.vst3"
          if [ ! -d "$VST3_PATH" ]; then
            echo "[ERROR] VST3 not found at $VST3_PATH"
            find build -name "*.vst3" -type d
            exit 1
          fi
          echo "[OK] VST3 bundle exists"

          BINARY="$VST3_PATH/Contents/MacOS/Guillotine Clip"
          if [ -f "$BINARY" ]; then
            lipo -info "$BINARY"
            SIZE=$(stat -f%z "$BINARY")
            SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
            echo "Size: ${SIZE_MB} MB"
          fi

          echo "=== Verifying AU bundle ==="
          AU_PATH="build/Guillotine_artefacts/Release/AU/Guillotine Clip.component"
          if [ ! -d "$AU_PATH" ]; then
            echo "[ERROR] AU not found at $AU_PATH"
            exit 1
          fi
          echo "[OK] AU bundle exists"
          lipo -info "$AU_PATH/Contents/MacOS/Guillotine Clip"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Guillotine-macOS
          path: |
            build/Guillotine_artefacts/Release/VST3/Guillotine Clip.vst3
            build/Guillotine_artefacts/Release/AU/Guillotine Clip.component
          retention-days: 30

  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            libasound2-dev \
            libcurl4-openssl-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libjack-jackd2-dev \
            libwebkit2gtk-4.0-dev \
            libx11-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxss-dev \
            pkg-config

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Verify Linux plugin bundles
        run: |
          echo "=== Checking VST3 bundle ==="
          VST3_PATH="build/Guillotine_artefacts/Release/VST3/Guillotine Clip.vst3"
          if [ -d "$VST3_PATH" ]; then
            echo "[OK] VST3 bundle exists"
            ls -la "$VST3_PATH/Contents/x86_64-linux/"
          else
            echo "[WARN] VST3 not found"
          fi

          echo "=== Checking LV2 bundle ==="
          LV2_PATH="build/Guillotine_artefacts/Release/LV2/Guillotine Clip.lv2"
          if [ -d "$LV2_PATH" ]; then
            echo "[OK] LV2 bundle exists"
            ls -la "$LV2_PATH/"
          else
            echo "[WARN] LV2 not found"
          fi

          echo "=== Checking CLAP bundle ==="
          CLAP_PATH="build/Guillotine_artefacts/Release/CLAP/Guillotine Clip.clap"
          if [ -f "$CLAP_PATH" ]; then
            echo "[OK] CLAP plugin exists"
            ls -la "$CLAP_PATH"
          else
            echo "[WARN] CLAP not found"
          fi

          # At least one format must exist
          if [ ! -d "$VST3_PATH" ] && [ ! -d "$LV2_PATH" ] && [ ! -f "$CLAP_PATH" ]; then
            echo "[ERROR] No Linux plugin formats found"
            find build -name "Guillotine*" -type f -o -name "Guillotine*" -type d
            exit 1
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Guillotine-Linux-x64
          path: |
            build/Guillotine_artefacts/Release/VST3/Guillotine Clip.vst3
            build/Guillotine_artefacts/Release/LV2/Guillotine Clip.lv2
            build/Guillotine_artefacts/Release/CLAP/Guillotine Clip.clap
            installer/linux/README.txt
          retention-days: 30

  test-macos:
    needs: [build-macos]
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: Guillotine-macOS
          path: ./plugin/

      - name: Install plugin to expected location
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/VST3
          cp -R ./plugin/VST3/Guillotine Clip.vst3 ~/Library/Audio/Plug-Ins/VST3/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Download pluginval
        run: |
          curl -L -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip pluginval.zip -d /usr/local/bin
          chmod +x /usr/local/bin/pluginval.app/Contents/MacOS/pluginval
          ln -s /usr/local/bin/pluginval.app/Contents/MacOS/pluginval /usr/local/bin/pluginval

      - name: Build C++ unit tests
        run: |
          cd tests/unit
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Run all tests
        run: pytest tests/ -v

  test-windows:
    needs: [build-windows]
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: Guillotine-VST3-Windows-x64
          path: ./plugin/

      - name: Install plugin to expected location
        shell: pwsh
        run: |
          $destDir = "C:\Program Files\Common Files\VST3"
          Write-Host "=== Downloaded artifact structure ==="
          Get-ChildItem "./plugin" -Recurse | Select-Object FullName

          # Artifact downloads as Guillotine Clip.vst3/Contents/... - copy the whole bundle
          if (Test-Path "./plugin/Guillotine Clip.vst3") {
            Write-Host "Found Guillotine Clip.vst3 folder in artifact"
            Copy-Item -Recurse -Force "./plugin/Guillotine Clip.vst3" "$destDir/"
          } else {
            Write-Host "Artifact contains raw Contents - wrapping in bundle folder"
            New-Item -ItemType Directory -Path "$destDir/Guillotine Clip.vst3" -Force
            Copy-Item -Recurse -Force "./plugin/*" "$destDir/Guillotine Clip.vst3/"
          }

          Write-Host "=== Installed plugin structure ==="
          Get-ChildItem "$destDir/Guillotine Clip.vst3" -Recurse | Select-Object FullName

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Download pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive -Path pluginval.zip -DestinationPath C:\pluginval -Force
          Get-ChildItem C:\pluginval -Recurse

      - name: Verify plugin binary
        shell: pwsh
        run: |
          $bundlePath = "C:\Program Files\Common Files\VST3\Guillotine Clip.vst3"
          $binaryPath = "$bundlePath\Contents\x86_64-win\Guillotine Clip.vst3"

          Write-Host "=== Bundle structure ==="
          Get-ChildItem $bundlePath -Recurse | ForEach-Object {
            $size = if ($_.PSIsContainer) { "[DIR]" } else { "$([math]::Round($_.Length/1KB, 1)) KB" }
            Write-Host "$size  $($_.FullName)"
          }

          if (Test-Path $binaryPath) {
            Write-Host ""
            Write-Host "[OK] VST3 binary exists: $binaryPath"
            $info = Get-Item $binaryPath
            Write-Host "Size: $([math]::Round($info.Length/1MB, 2)) MB"
            Write-Host "Modified: $($info.LastWriteTime)"
          } else {
            Write-Error "VST3 binary not found at expected path: $binaryPath"
            exit 1
          }

      - name: Run pluginval
        shell: pwsh
        run: |
          $pluginval = Get-ChildItem C:\pluginval -Filter "pluginval.exe" -Recurse | Select-Object -First 1
          $vst3 = "C:\Program Files\Common Files\VST3\Guillotine Clip.vst3"
          Write-Host "Running pluginval on: $vst3"
          & $pluginval.FullName --validate "$vst3" --strictness-level 5 --verbose

      - name: Build C++ unit tests
        run: |
          cd tests/unit
          cmake -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release

      - name: Run all tests
        run: pytest tests/ -v

  # Package macOS installer (signed + notarized)
  package-macos:
    needs: [build-macos, test-macos]
    runs-on: macos-14
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: Guillotine-macOS
          path: ./artifacts/

      - name: Prepare build structure
        run: |
          mkdir -p build/Guillotine_artefacts/Release/VST3
          mkdir -p build/Guillotine_artefacts/Release/AU

          # Handle different artifact structures
          if [ -d "./artifacts/VST3/Guillotine Clip.vst3" ]; then
            cp -R ./artifacts/VST3/Guillotine Clip.vst3 build/Guillotine_artefacts/Release/VST3/
          elif [ -d "./artifacts/Guillotine Clip.vst3" ]; then
            cp -R ./artifacts/Guillotine Clip.vst3 build/Guillotine_artefacts/Release/VST3/
          fi

          if [ -d "./artifacts/AU/Guillotine Clip.component" ]; then
            cp -R ./artifacts/AU/Guillotine Clip.component build/Guillotine_artefacts/Release/AU/
          elif [ -d "./artifacts/Guillotine Clip.component" ]; then
            cp -R ./artifacts/Guillotine Clip.component build/Guillotine_artefacts/Release/AU/
          fi

          echo "=== Build structure ==="
          find build/Guillotine_artefacts -type d

      - name: Get version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '\n')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Import certificates
        env:
          APPLE_CERTIFICATE_APPLICATION: ${{ secrets.APPLE_CERTIFICATE_APPLICATION }}
          APPLE_CERTIFICATE_INSTALLER: ${{ secrets.APPLE_CERTIFICATE_INSTALLER }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificates
          echo "$APPLE_CERTIFICATE_APPLICATION" | base64 --decode > $RUNNER_TEMP/app.p12
          echo "$APPLE_CERTIFICATE_INSTALLER" | base64 --decode > $RUNNER_TEMP/installer.p12

          security import $RUNNER_TEMP/app.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import $RUNNER_TEMP/installer.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # Download and import Apple intermediate certificate
          curl -sO https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import DeveloperIDG2CA.cer -k "$KEYCHAIN_PATH"

          # Set keychain search list
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

          # Allow codesign to access the keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Verify
          echo "=== Available signing identities ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

      - name: Sign and package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG_ROOT="build/pkg-root"
          PKG_OUT="build/installer"
          APP_IDENTITY="Developer ID Application: Noah Baxter (KUP5WU7WPC)"
          PKG_IDENTITY="Developer ID Installer: Noah Baxter (KUP5WU7WPC)"

          # Create package structure
          mkdir -p "$PKG_ROOT/Library/Audio/Plug-Ins/VST3"
          mkdir -p "$PKG_ROOT/Library/Audio/Plug-Ins/Components"
          mkdir -p "$PKG_OUT"

          # Copy plugins
          cp -R build/Guillotine_artefacts/Release/VST3/Guillotine Clip.vst3 "$PKG_ROOT/Library/Audio/Plug-Ins/VST3/"
          cp -R build/Guillotine_artefacts/Release/AU/Guillotine Clip.component "$PKG_ROOT/Library/Audio/Plug-Ins/Components/"

          # Sign plugins
          echo "=== Signing VST3 ==="
          codesign --force --deep --sign "$APP_IDENTITY" \
            --options runtime --timestamp \
            "$PKG_ROOT/Library/Audio/Plug-Ins/VST3/Guillotine Clip.vst3"

          echo "=== Signing AU ==="
          codesign --force --deep --sign "$APP_IDENTITY" \
            --options runtime --timestamp \
            "$PKG_ROOT/Library/Audio/Plug-Ins/Components/Guillotine Clip.component"

          # Verify signatures
          codesign --verify --deep --strict "$PKG_ROOT/Library/Audio/Plug-Ins/VST3/Guillotine Clip.vst3"
          codesign --verify --deep --strict "$PKG_ROOT/Library/Audio/Plug-Ins/Components/Guillotine Clip.component"

          # Build package
          echo "=== Building package ==="
          pkgbuild \
            --root "$PKG_ROOT" \
            --identifier "com.dichoticstudios.guillotine.pkg" \
            --version "$VERSION" \
            --install-location "/" \
            "$PKG_OUT/Guillotine-unsigned.pkg"

          # Sign package
          echo "=== Signing package ==="
          productsign \
            --sign "$PKG_IDENTITY" \
            "$PKG_OUT/Guillotine-unsigned.pkg" \
            "$PKG_OUT/Guillotine-${VERSION}-macOS.pkg"

          rm "$PKG_OUT/Guillotine-unsigned.pkg"

          # Verify package
          pkgutil --check-signature "$PKG_OUT/Guillotine-${VERSION}-macOS.pkg"

      - name: Notarize
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG="build/installer/Guillotine-${VERSION}-macOS.pkg"

          echo "=== Submitting for notarization ==="
          xcrun notarytool submit "$PKG" \
            --keychain-profile "notarytool-profile" \
            --wait

          echo "=== Stapling ticket ==="
          xcrun stapler staple "$PKG"
          xcrun stapler validate "$PKG"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Guillotine-Installer-macOS
          path: build/installer/Guillotine-*.pkg
          retention-days: 30

  # Package Windows installer (unsigned)
  package-windows:
    needs: [build-windows, test-windows]
    runs-on: windows-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: Guillotine-VST3-Windows-x64
          path: ./artifacts/

      - name: Prepare build structure
        shell: pwsh
        run: |
          # Create expected directory structure for Inno Setup
          New-Item -ItemType Directory -Path "build/Guillotine_artefacts/Release/VST3" -Force

          # Artifact downloads as Guillotine Clip.vst3/ folder
          if (Test-Path "./artifacts/Guillotine Clip.vst3") {
            Copy-Item -Recurse "./artifacts/Guillotine Clip.vst3" "build/Guillotine_artefacts/Release/VST3/"
          } else {
            # Or it might be the contents directly
            New-Item -ItemType Directory -Path "build/Guillotine_artefacts/Release/VST3/Guillotine Clip.vst3" -Force
            Copy-Item -Recurse "./artifacts/*" "build/Guillotine_artefacts/Release/VST3/Guillotine Clip.vst3/"
          }

          Write-Host "=== Build structure ==="
          Get-ChildItem -Recurse "build/Guillotine_artefacts/Release/VST3" | Select-Object FullName

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $version = Get-Content VERSION -Raw
          $version = $version.Trim()
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          cd installer/windows
          & $iscc /DVERSION=$version installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Guillotine-Installer-Windows
          path: installer/windows/Guillotine-*.exe
          retention-days: 30

  # Check if release is needed
  check-release:
    needs: [build-windows, build-macos, build-linux, test-macos, test-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if VERSION changed
        id: check
        run: |
          VERSION=$(cat VERSION | tr -d '\n')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists, skipping release"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "New version $VERSION detected, will create release"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  # Create GitHub release with installers
  release:
    needs: [check-release, package-macos, package-windows]
    runs-on: ubuntu-latest
    if: needs.check-release.outputs.should_release == 'true'
    permissions:
      contents: write

    steps:
      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: Guillotine-Installer-macOS
          path: ./installers/

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: Guillotine-Installer-Windows
          path: ./installers/

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: Guillotine-Linux-x64
          path: ./linux-plugins/

      - name: Create Linux archive
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          cd linux-plugins
          zip -r "../installers/Guillotine-${VERSION}-Linux-x64.zip" .

      - name: List installers
        run: ls -la installers/

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.check-release.outputs.version }}
          name: Guillotine v${{ needs.check-release.outputs.version }}
          draft: true
          files: |
            installers/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to R2 CDN
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://ee4f7641599153d817b6bddbea5483e7.r2.cloudflarestorage.com
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          cp installers/Guillotine-${VERSION}-macOS.pkg installers/Guillotine-macOS.pkg
          cp installers/Guillotine-${VERSION}-Windows-x64.exe installers/Guillotine-Windows.exe
          cp installers/Guillotine-${VERSION}-Linux-x64.zip installers/Guillotine-Linux-x64.zip
          aws s3 cp installers/Guillotine-macOS.pkg s3://vst-guillotine/ --endpoint-url $AWS_ENDPOINT_URL --region auto
          aws s3 cp installers/Guillotine-Windows.exe s3://vst-guillotine/ --endpoint-url $AWS_ENDPOINT_URL --region auto
          aws s3 cp installers/Guillotine-Linux-x64.zip s3://vst-guillotine/ --endpoint-url $AWS_ENDPOINT_URL --region auto

  # Manual/tag release (when pushing a tag directly)
  release-from-tag:
    needs: [package-macos, package-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: Guillotine-Installer-macOS
          path: ./installers/

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: Guillotine-Installer-Windows
          path: ./installers/

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: Guillotine-Linux-x64
          path: ./linux-plugins/

      - name: Create Linux archive
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd linux-plugins
          zip -r "../installers/Guillotine-${VERSION}-Linux-x64.zip" .

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          name: Guillotine v${{ steps.version.outputs.version }}
          draft: true
          files: |
            installers/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to R2 CDN
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
