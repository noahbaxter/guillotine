<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 48" width="32" height="48">
  <defs>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#888"/>
      <stop offset="30%" stop-color="#d0d0d0"/>
      <stop offset="50%" stop-color="#f5f5f5"/>
      <stop offset="70%" stop-color="#c0c0c0"/>
      <stop offset="100%" stop-color="#777"/>
    </linearGradient>
  </defs>

  <!-- Lever shaft (pointing up from center-bottom) -->
  <rect x="13" y="4" width="6" height="28" rx="3" fill="url(#chrome)" stroke="#666" stroke-width="0.5"/>

  <!-- Rounded bat tip -->
  <ellipse cx="16" cy="6" rx="4" ry="5" fill="url(#chrome)" stroke="#666" stroke-width="0.5"/>

  <!-- Highlight on tip -->
  <ellipse cx="14.5" cy="5" rx="1.5" ry="2" fill="rgba(255,255,255,0.5)"/>

  <!-- Base collar (where it meets the nut) -->
  <ellipse cx="16" cy="32" rx="5" ry="2" fill="#999" stroke="#666" stroke-width="0.5"/>
</svg>
