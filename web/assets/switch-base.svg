<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="hex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c0c0c0"/>
      <stop offset="50%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </linearGradient>
  </defs>

  <!-- Hex nut (front view) -->
  <polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="url(#hex)" stroke="#666" stroke-width="1"/>

  <!-- Inner dark hole -->
  <circle cx="16" cy="16" r="6" fill="#1a1a1a"/>

  <!-- Subtle highlight on hex edges -->
  <polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
</svg>
